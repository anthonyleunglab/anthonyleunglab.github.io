    type: organization
    tagline: "Poly(ADP-ribose), RNA Biology & PAR Technology"
    description: "The Leung Lab at Johns Hopkins investigates how gene regulation impacts disease through the lens of poly(ADP-ribose) (PAR) biology. Our research spans PAR technology development, RNA regulation, biomolecular condensates, antiviral strategies, and disease mechanisms including cancer and neurodegeneration."
